ordinary_per_listed = 1              # 1 ADS = 1 ordinary share since Mar 18, 2021
subdivisions = [["2021-03-18", 8]]   # 1-to-8 subdivision; before it 8 ADS = 1 ordinary share
source = "Trip.com 6-K Mar 2021 and 20-F FY2021 (SEC); BNY Mellon notice to Nasdaq Mar 10, 2021"

