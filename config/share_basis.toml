# Share counts for market cap (src/calculate/market_cap_history.py) - REVIEWED LIST, edit only with a source.
#
# SEC reports share counts in the company's ORDINARY shares. For a foreign company that trades in the US as an
# ADS (American depositary share), one ADS can stand for several ordinary shares, so price x SEC shares would be
# wrong. For the tickers below:
#     shares on today's ADS basis = SEC ordinary shares x subdivision factor (filings before the date)
#                                   / ordinary_per_listed (ordinary shares per ADS TODAY)
# and the price history's "splits" (ADS ratio changes) are NOT applied to the SEC counts.
# Every other ticker: SEC shares are in the listed shares; stock splits after the filing are applied.

[[ticker]]
ticker = "BIDU"
ordinary_per_listed = 8              # 1 ADS = 8 Class A ordinary shares since Mar 1, 2021
subdivisions = [["2021-03-01", 80]]  # 1-to-80 share subdivision; older filings counted pre-subdivision shares
source = "Baidu 6-K Jan 2021 and 20-F FY2021 (SEC): ratio 10 ADS = 1 share changed to 1 ADS = 8 shares"

