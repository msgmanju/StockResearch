# Manual SEC company numbers (CIK) for stocks the automatic matching gets wrong or can't find.
# Look a company up at https://www.sec.gov/edgar/searchedgar/companysearch and add:
#
# [[cik]]
# ticker = "XYZ"
# cik = 1234567
# note = "why"
#
# Several entries for one ticker = the company changed SEC number (holding-company reorganization,
# merger); list them oldest first - each is used from its first periodic report on.
# no_sec_data = true: the company never filed financial statements with the SEC (e.g. banks that
# filed with the FDIC instead).

